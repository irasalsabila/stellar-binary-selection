[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-binary-selection"
version = "0.1.0"
description = "Physics-informed photometric selection functions for unresolved stellar binaries with Gaia DR3 and 2MASS."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "stellar-binary-selection contributors"}]
keywords = ["astrophysics", "binary-stars", "gaia", "physics-informed-ml", "selection-function"]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.11",
  "astropy>=6.0",
  "astroquery>=0.4.7",
  "scikit-learn>=1.3",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "torch>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
astrometric = ["gaiaunlimited>=1.0"]
dust = ["dustmaps>=1.0", "healpy>=1.16"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/irasalsabila/stellar-binary-selection"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
